<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
</head>
<body>

    <div class="layout">

        <header>
            <h2>My Dashboard</h2>
        </header>

        <aside>
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main>
            <div class="gallery">

                <div class="item">
                    <span class="icon">👤</span>
                    <div>
                        <b>120</b><br>
                        Users
                    </div>
                </div>

                <div class="item">
                    <span class="icon">💰</span>
                    <div>
                        <b>Rs 45k</b><br>
                        Sales
                    </div>
                </div>

                <div class="item">
                    <span class="icon">📦</span>
                    <div>
                        <b>36</b><br>
                        Orders
                    </div>
                </div>

                <div class="item">
                    <span class="icon">⭐</span>
                    <div>
                        <b>4.8</b><br>
                        Rating
                    </div>
                </div>

                <div class="item">
                    <span class="icon">💬</span>
                    <div>
                        <b>18</b><br>
                        Messages
                    </div>
                </div>

                <div class="item">
                    <span class="icon">✅</span>
                    <div>
                        <b>92%</b><br>
                        Done
                    </div>
                </div>

            </div>
        </main>

        <footer>
            Made with CSS Grid
        </footer>

    </div>

</body>
</html>
